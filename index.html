<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPI Python — MTsN 1 Alor</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="topbar__brand">
      <button class="topbar__menu-btn" id="topbar-menu-btn" aria-label="Buka menu">☰</button>
      <span class="logo-mark">📝</span>
      <div>
        <strong>MPI Python</strong>
        <small>MTsN 1 Alor · Informatika Fase D</small>
      </div>
    </div>
    <div class="topbar__stats">
      <span class="chip">⭐ <b id="stat-poin">0</b><span class="txt"> poin</span></span>
      <span class="chip">🏆 <b id="stat-badge">0/5</b></span>
      <span class="chip">📊 <b id="stat-progress">0%</b></span>
      <div class="progress-track" style="width:90px;"><div class="progress-fill" id="global-progress-fill" style="width:0%"></div></div>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Menu utama"></nav>
    <main class="content" id="content"></main>
  </div>

  <footer class="footer-note">MPI Python · Informatika Kelas IX · MTsN 1 Alor · Dapat dijalankan sepenuhnya offline, tanpa server dan tanpa koneksi internet.</footer>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <button class="modal-box__close" id="modal-close" aria-label="Tutup">✕</button>
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
